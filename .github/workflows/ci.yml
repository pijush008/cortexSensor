name: CI

# Every pull request, and every push to main. A branch that is not yet a PR
# does not burn minutes; the moment it is proposed for main, every gate runs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress. Only the
# latest state of a branch can be merged, so only its result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # timescaledb, not plain postgres. measurements.test.ts asserts that
        # measurements IS a hypertable, and the 20260916 migration branches on
        # whether the extension exists — so a plain image silently exercises a
        # different storage path from the one every developer runs, and fails a
        # test that has nothing wrong with it.
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: shm
          POSTGRES_PASSWORD: shm_pass
          POSTGRES_DB: shm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        # rate-limit-store.test.ts asserts that Redis is reachable rather than
        # skipping when it is not — the same deliberate choice the analysis
        # suites make about the engine. So CI must actually run one.
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          # 22, matching every Dockerfile in the repo. Not cosmetic: docker-compose
          # records that @tailwindcss/oxide's native binding declares
          # `engines: { node: ">= 20" }`, and npm SILENTLY SKIPS an optional dep
          # whose engines do not match — so on 18 the frontend installs without
          # error and then fails every render.
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The analysis suites assert that the engine is REACHABLE rather than
      # skipping when it is not — a deliberate choice, since a silently skipped
      # spectral test is worse than a red one. So CI has to actually run the
      # engine; without this step `analysis.test.ts` and `engine-transport.test.ts`
      # fail every build with "SHM engine unreachable".
      - name: Start the SHM analysis engine
        run: |
          cd python_shm_service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Same generation the container entrypoint runs, pointed at the
          # checkout instead of the /proto and /app mounts compose provides.
          PROTO_DIR="$GITHUB_WORKSPACE/proto" APP_DIR="$PWD" ./generate_proto.sh
          python -m serve_all &
          # serve_all starts gRPC first and then hands the main thread to
          # uvicorn, so an answer on the HTTP face means both are listening.
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8000/health >/dev/null && break
            sleep 2
          done
          # Fail the step here rather than letting every analysis test report
          # the same unreachable-engine assertion.
          curl -sf http://localhost:8000/health
      - name: Install deps, prepare DB and run tests
        env:
          DATABASE_URL: postgresql://shm:shm_pass@localhost:5432/shm_ci?schema=public
          # schema.prisma declares `directUrl`, so Prisma requires DIRECT_URL to
          # exist in EVERY environment that loads the schema — not only the ones
          # that talk to Supabase. Against a plain Postgres there is no pooler in
          # between, so the two are the same connection.
          DIRECT_URL: postgresql://shm:shm_pass@localhost:5432/shm_ci?schema=public
          REDIS_URL: redis://localhost:6379
          # The gRPC client loads the contract at runtime and defaults to the
          # container's /proto mount, which does not exist on a CI runner.
          SHM_ENGINE_PROTO_PATH: ${{ github.workspace }}/proto/shm/engine/v1/engine.proto
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          cd backend
          npm ci
          # wait for Postgres service
          until pg_isready -h localhost -p 5432 -U shm; do echo "waiting for postgres"; sleep 1; done
          # Enable TimescaleDB explicitly rather than trusting the image to have
          # done it. The extension is PER-DATABASE, and the dev stack enables it
          # through docker-init/init_timescale.sql — a bind mount that CI does
          # not have. measurements.test.ts asserts the hypertable exists and the
          # 20260916 migration branches on this, so leaving it to chance means CI
          # silently exercises the unpartitioned path.
          PGPASSWORD=shm_pass psql -h localhost -U shm -d shm_ci \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;"
          # Typecheck first: it is the fastest signal, and a red suite full of
          # "cannot find name" is a typecheck failure reported one test at a
          # time.
          npx tsc --noEmit
          npx prisma migrate deploy
          # The schema must be what the migrations produce. A developer who
          # edits schema.prisma and forgets `migrate dev` gets a green local
          # run — their client is generated from the schema — and a broken
          # deploy, because production only ever runs the migrations.
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
          npm run prisma:seed
          npm run test:run
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          # 22, matching every Dockerfile in the repo. Not cosmetic: docker-compose
          # records that @tailwindcss/oxide's native binding declares
          # `engines: { node: ">= 20" }`, and npm SILENTLY SKIPS an optional dep
          # whose engines do not match — so on 18 the frontend installs without
          # error and then fails every render.
          node-version: 22
      - name: Install deps and check
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
          npm run lint
          npm run test:run
          # A failed build used to pass this job (`|| true`). It is the one
          # check that says the image can be produced at all, so it fails.
          npm run build
  python-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps and run the engine's tests
        run: |
          cd python_shm_service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          PROTO_DIR="$GITHUB_WORKSPACE/proto" APP_DIR="$PWD" ./generate_proto.sh
          python -m unittest discover -s . -p "test_*.py" -v

  # The production images must build from this commit. Nothing else here
  # exercises the Dockerfiles, and a Dockerfile that no longer matches the
  # tree — a renamed script, a moved proto — is found on the server otherwise.
  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build every production image
        run: |
          # compose validates env_file paths before building; the real one is
          # never in git.
          touch .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod build

  # The single check branch protection requires. It fails if any job above
  # failed or was cancelled, so adding a job means adding it to `needs` and
  # nothing in the repository settings.
  ci-ok:
    needs: [backend, frontend, python-service, docker-images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every gate passed
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled|skipped)"'; then
            echo "A required job did not pass."; exit 1
          fi
