# vsftpd for the Ackcio gateway's FTPS uploads.
#
# Installed by deploy/vsftpd/setup.sh, which fills in DOMAIN and PUBLIC_IP.
# One local user, "ackcio", locked into /srv/ftp/ackcio; it can write only
# into incoming/, which the API container watches (FTP_INGEST_DIR=/ingest).
#
# FTPS, not FTP: the gateway sends its login and its readings over this
# link. Explicit TLS on port 21 with a Let's Encrypt certificate, because the
# Ackcio specification says self-signed certificates are not supported.

listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
# Uploaded files are group-writable, so the API container (running as uid
# 1000, in the directory's group) can move them once processed.
local_umask=002
file_open_mode=0664

# Jail the user in its home. The home itself must NOT be writable (vsftpd
# refuses to run otherwise); incoming/ beneath it is.
chroot_local_user=YES
allow_writeable_chroot=NO
local_root=/srv/ftp/ackcio
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# Passive mode, which is what a gateway behind NAT needs. Open these ports in
# the firewall along with 21.
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
pasv_address=PUBLIC_IP

# TLS.
ssl_enable=YES
force_local_data_ssl=YES
force_local_logins_ssl=YES
ssl_tlsv1_2=YES
ssl_tlsv1_3=YES
ssl_tlsv1=NO
ssl_sslv2=NO
ssl_sslv3=NO
rsa_cert_file=/etc/letsencrypt/live/DOMAIN/fullchain.pem
rsa_private_key_file=/etc/letsencrypt/live/DOMAIN/privkey.pem
# Some FTPS clients cannot resume the control session's TLS on the data
# connection; requiring it makes their uploads fail after the login succeeds.
require_ssl_reuse=NO
ssl_ciphers=HIGH

# Logging: one line per transfer, for tracing a file from upload to ledger.
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=NO
vsftpd_log_file=/var/log/vsftpd.log

# Keep the gateway's clock-driven retries from piling up connections.
max_clients=20
max_per_ip=5
idle_session_timeout=300
data_connection_timeout=120
dirmessage_enable=NO
use_localtime=NO
