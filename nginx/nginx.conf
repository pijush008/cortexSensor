worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # WebSocket / SSE upgrade mapping
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Optional: raise proxy timeouts for request/response streaming (data downloads, reports)
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
  client_max_body_size 25m;

  # Upstream hostnames are resolved AT REQUEST TIME, not at startup.
  #
  # nginx resolves the host in an `upstream` block once, while parsing the
  # config, and exits with "[emerg] host not found in upstream" if it cannot.
  # docker-compose `depends_on` only waits for a container to START, not to be
  # ready — and the frontend spends minutes in `npm ci` before it listens. So
  # nginx lost that race on every boot and crash-looped indefinitely.
  #
  # Using Docker's embedded DNS as a `resolver` and putting the upstream in a
  # VARIABLE defers resolution to each request, so nginx starts cleanly and
  # simply returns 502 until the service behind it answers — which is the
  # correct behaviour for a proxy whose backend is still starting.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ── Port 80: redirect, and nothing else ─────────────────────────────────────
  #
  # The app cannot work over plain HTTP. Session cookies are issued with
  # `secure: true` in production (backend/src/utils/cookies.ts), and a browser
  # will not store a Secure cookie that arrived over http:// — so a user could
  # submit correct credentials, receive a 200, and still not be logged in, with
  # nothing in the logs to explain it.
  #
  # The ACME location is carved out so certbot can answer a challenge without
  # being bounced to a certificate that does not exist yet.
  server {
    listen 80;
    listen [::]:80;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── Port 443: the application ───────────────────────────────────────────────
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Mounted by docker-compose.prod.yml from ./nginx/certs.
    # See nginx/certs/README for how to obtain a real pair.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2 and 1.3 only. 1.0 and 1.1 are deprecated and no longer trusted by
    # current browsers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS. Deliberately WITHOUT preload and without includeSubDomains: both are
    # hard to undo — preload especially, since removal takes months to reach
    # browsers — and neither belongs in a config committed before the domain is
    # decided. Add them once the certificate is real and the domain is settled.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Python SHM engineering service
    location /shm/ {
      set $shm_python "python-shm:8000";
      # The /shm/ prefix must be stripped explicitly. When proxy_pass targets a
      # VARIABLE, nginx does not perform the usual location-prefix replacement,
      # so without this rewrite the engine receives /shm/health and 404s.
      rewrite ^/shm/(.*)$ /$1 break;
      proxy_pass http://$shm_python;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
      set $shm_backend "backend:3001";
      proxy_pass http://$shm_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Server-sent events: no buffering, and a long read timeout, or the live
      # measurement stream is cut every two minutes.
      proxy_buffering off;
      proxy_cache off;
    }

    # Frontend (Next.js) — default route
    location / {
      set $shm_frontend "frontend:3000";
      proxy_pass http://$shm_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
