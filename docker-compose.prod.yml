# Production stack for a single VPS.
#
# What is NOT here is the point:
#
#   postgres  -> Supabase (ap-northeast-2), reached over the transaction pooler
#   redis     -> Upstash
#   mosquitto -> gone; MQTT was removed, devices ingest over HTTPS
#
# So the box runs four containers: the API, the web app, the analysis engine,
# and nginx in front of them. Nothing here bind-mounts source code — every
# service runs a built image, which is the difference between this file and
# docker-compose.yml.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Migrations are NOT run automatically on boot. A container that migrates as it
# starts will, on a rolling restart, run two migrations at once against the same
# database. Run it deliberately:
#
#   docker compose -f docker-compose.prod.yml run --rm backend npx prisma migrate deploy

# Its own compose project, deliberately.
#
# Both files otherwise derive their project name from the directory — "shm" —
# so they share container names like shm-backend-1. Starting this file while a
# dev container of the same name exists REUSES that container, and the dev file
# publishes 3000, 3001, 8000, 50051, 5432 and 6379 straight to 0.0.0.0. The
# result is a "production" stack serving the database and the app directly to
# the internet, past nginx, while this file still says `expose`.
#
# Docker writes its own iptables rules ahead of ufw's, so a firewall would
# report those ports closed while they were answering. A distinct project name
# keeps the two sets of containers from ever meeting.
name: shm-prod

services:
  backend:
    build:
      # Repository root, so the image can COPY both backend/ and proto/.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      NODE_ENV: production
      PORT: 3001
      # Inside the compose network, not localhost — which in this container is
      # nothing at all.
      SHM_ENGINE_URL: "http://python-shm:8000"
      SHM_ENGINE_GRPC_URL: "python-shm:50051"
    depends_on:
      python-shm:
        condition: service_started
    expose: ["3001"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty on purpose: the browser then calls the relative /api, which
        # nginx routes to the backend on the same origin. Setting an absolute
        # URL here bakes one hostname into the bundle and breaks every other.
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose: ["3000"]

  python-shm:
    build:
      context: ./python_shm_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      GRPC_PORT: "50051"
    volumes:
      # The contract, shared read-only with the backend image. One .proto, two
      # consumers, no generated copy to drift.
      - ./proto:/proto:ro
    expose: ["8000", "50051"]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # 80 exists only to redirect to 443 and to answer ACME challenges.
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # fullchain.pem and privkey.pem. Read-only, and gitignored — a private
      # key does not belong in a repository.
      - ./nginx/certs:/etc/nginx/certs:ro
      # Where certbot writes its challenge files when renewing.
      - ./nginx/certbot:/var/www/certbot
    depends_on:
      - frontend
      - backend
      - python-shm
