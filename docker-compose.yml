services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: shm
      POSTGRES_PASSWORD: shm_pass
      POSTGRES_DB: shm_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    # Built from Dockerfile.dev rather than run straight from node:22, so the
    # service runs as uid 1000 and everything it writes into the bind mount is
    # owned by the developer. See that file for why the image has to pre-create
    # node_modules.
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    # Node 22, not 18.
    #
    # Node 18 reached end of life in April 2025, so it receives no security
    # patches of its own — and the fix for nodemailer's misrouting advisory
    # (GHSA-mm7p-fcc7-pg87, which affects every version <= 9.1.0) is
    # nodemailer 10, whose engines field requires Node >= 20. The runtime was
    # the thing pinning a known-vulnerable mail library in place.
    #
    # 22 rather than 20, to match the frontend service and keep one Node
    # version across the stack.
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
      # The same contract the engine serves, read-only. One .proto, two
      # consumers, no generated copy to fall out of step.
      - ./proto:/proto:ro
    environment:
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=4096"
      DATABASE_URL: "postgresql://shm:shm_pass@postgres:5432/shm_dev?schema=public"
      # Defaults to the local container so the dev stack costs nothing to
      # run. Export REDIS_URL (e.g. the Upstash endpoint) to point the
      # containers at a managed instance instead — worth doing
      # deliberately, since the rate limiter touches Redis on every
      # request and a metered plan bills per command.
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      PORT: 3001
      MQTT_BROKER_URL: "mqtt://mosquitto:1883"
      MQTT_INGEST_ENABLED: "true"
      MQTT_INGEST_TOPICS: "shm/ingest/#"
      MQTT_USERNAME: "shm-backend"
      MQTT_PASSWORD: "shm-backend-pass"
      # The analysis engine, addressed by its compose service name. Without
      # this the backend falls back to localhost:8000, which inside its own
      # container is nothing — every analysis run fails while the engine sits
      # healthy one hop away. Host-run tests hide it, because 8000 is published.
      SHM_ENGINE_URL: "http://python-shm:8000"
      # The engine's gRPC address, and the switch that selects it.
      #
      # Both faces of the engine stay live, so reverting to JSON over HTTP is
      # SHM_ENGINE_TRANSPORT=http and a restart — not a redeploy. The default is
      # grpc because that is the path worth exercising.
      SHM_ENGINE_GRPC_URL: "python-shm:50051"
      SHM_ENGINE_TRANSPORT: "grpc"
      # Origin used to build links that are EMAILED to people — verification,
      # password reset and project invitations. Must be an address the
      # RECIPIENT'S browser can open, so it is the app's own origin rather than
      # the backend's port: getBaseUrl() otherwise falls back to
      # http://localhost:3001, which nobody browses.
      #
      # Read from the environment rather than written here, because the correct
      # value is a property of the deployment, not of this file. Set APP_URL in
      # a .env file next to this compose file (or export it) to point emailed
      # links at a real host:
      #
      #   APP_URL=https://shm.example.com
      #
      # Both names are set from the ONE variable on purpose. They mean the same
      # thing — the origin an emailed link should point at — and are read by
      # different code paths (getBaseUrl in utils/helper for verification mail,
      # config.appUrl for password resets, invitations and the Google redirect).
      # Letting them drift would mean one kind of email working and another
      # silently pointing somewhere nobody can reach.
      #
      # The fallback is the address this stack publishes locally, so an
      # unconfigured checkout still behaves exactly as it did.
      BASE_URL: "${APP_URL:-http://localhost:3000}"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      # Billing. The webhook verifies an HMAC over the raw body; with no secret
      # the endpoint refuses rather than accepting unsigned traffic.
      BILLING_ENABLED: "true"
      BILLING_WEBHOOK_SECRET: "dev-webhook-secret"
    ports:
      - "3001:3001"
    command: sh -c "npm ci --silent || npm install --silent && ./docker-entrypoint.sh"
    depends_on:
      - postgres
      - redis
      - mosquitto
      - python-shm

  frontend:
    # Node 20+ is required, not optional: @tailwindcss/oxide-linux-x64-gnu (the
    # Tailwind v4 native binding) declares `engines: { node: ">= 20" }`, and npm
    # SILENTLY SKIPS optional deps whose engines don't match the running Node.
    # On node:18 it is omitted with no install error, and the dev server then
    # fails every render with "Cannot find native binding" on globals.css.
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Keep the container's node_modules off the host bind mount, matching the
      # backend and node-gateway services. Without this the container's root-owned
      # `npm install` writes straight into ./frontend/node_modules on the host,
      # which then breaks host-side `npm install` with EACCES.
      - /app/node_modules
      # Same reasoning for .next. The container runs `next dev`, which keeps a
      # development build here; a host-side `npm run build` writes a PRODUCTION
      # build to the same path through the bind mount and the dev server then
      # dies with "ENOENT .next/routes-manifest.json" on every request. An
      # anonymous volume gives the container its own .next so the two cannot
      # collide.
      - /app/.next
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: "/api"
      # Target for the Next rewrite that forwards /api to the backend, so the
      # app works when opened directly on the frontend's port and not only
      # through nginx.
      BACKEND_ORIGIN: "http://backend:3001"
      # NOTE: broker credentials are deliberately NOT provided to the frontend.
      # Next.js inlines every NEXT_PUBLIC_* value into the client bundle, so a
      # broker password here would be readable in page source, and the old
      # `shm/feed/#` subscription spanned every tenant (audit finding SEC-1).
      # Live data now reaches the browser through the API's authenticated,
      # tenant-filtered SSE stream at /api/v1/stream/measurements.
    ports:
      # 3000 on the host as well as in the container, so the address people
      # actually type — http://localhost:3000 — reaches the app. 3005 is kept
      # so any existing bookmark still resolves.
      - "3000:3000"
      - "3005:3000"
    # `npm ci` (not `npm install`) so platform-specific optional deps such as
    # @tailwindcss/oxide-linux-x64-gnu resolve correctly from the lockfile —
    # plain `npm install` hits npm/cli#4828 and silently omits them, which
    # breaks the Tailwind postcss pass with "Cannot find native binding".
    # Matches the backend and node-gateway services.
    command: sh -c "npm ci --silent || npm install --silent && npm run dev"
    depends_on:
      - backend

  python-shm:
    build:
      context: ./python_shm_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      # gRPC. The API tier reaches it as python-shm:50051 on the compose
      # network; publishing it as well is for grpcurl from the host.
      - "50051:50051"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - GRPC_PORT=50051
    volumes:
      - ./python_shm_service:/app
      # The contract, shared with the backend. Mounted read-only into both so
      # there is exactly one .proto and neither side can quietly edit the other's
      # copy — a generated client that disagrees with the server is the failure
      # this arrangement exists to prevent.
      - ./proto:/proto:ro
    depends_on:
      - postgres

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro

  node-gateway:
    # Node 22, matching the backend and frontend. Node 18 went end of life in
    # April 2025 and receives no security patches; this service simulates field
    # hardware publishing to the broker, so there is nothing here that pins it
    # to an older runtime.
    build:
      context: ./gateway
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./gateway:/app
      - /app/node_modules
    environment:
      # Defaults to the local container so the dev stack costs nothing to
      # run. Export REDIS_URL (e.g. the Upstash endpoint) to point the
      # containers at a managed instance instead — worth doing
      # deliberately, since the rate limiter touches Redis on every
      # request and a metered plan bills per command.
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      MQTT_BROKER: "mqtt://mosquitto:1883"
      MQTT_USERNAME: "shm-gateway"
      MQTT_PASSWORD: "shm-gateway-pass"
      TOPIC: "shm/ingest/shm-gateway/data"
    command: sh -c "npm ci --silent || npm install --silent && node index.js"
    depends_on:
      - mosquitto
      - redis
      - backend

  firebase-bridge:
    # Follows a Firestore collection an ESP32 writes to and forwards each new
    # reading into the same ingest endpoint the broker path uses.
    #
    # PROFILE-GATED: it needs a Firebase service-account key, which this repo
    # does not and must not contain, so it stays out of `docker compose up`
    # until you ask for it:
    #
    #   docker compose --profile firebase up -d firebase-bridge
    profiles: ["firebase"]
    build:
      context: ./firebase-bridge
      dockerfile: Dockerfile.dev
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./firebase-bridge:/app
      - /app/node_modules
      # The service-account JSON, mounted read-only from wherever you keep it.
      # Set FIREBASE_CREDENTIALS on the host to its path.
      - ${FIREBASE_CREDENTIALS:-./firebase-bridge/service-account.json}:/run/secrets/firebase.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/firebase.json"
      FIREBASE_COLLECTION: "${FIREBASE_COLLECTION:-telemetry}"
      BACKEND_URL: "http://backend:3001/api/beamDeviceData"
      # Must match IOT_API_KEY in backend/.env, or every reading is refused.
      IOT_API_KEY: "${IOT_API_KEY:-change-me-to-random-value}"
      FIREBASE_BACKFILL_MINUTES: "${FIREBASE_BACKFILL_MINUTES:-10}"
    command: sh -c "npm ci --silent || npm install --silent && node index.js"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - python-shm

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
