# SHM Mosquitto broker — dev cluster
#
# Auth is enforced (allow_anonymous false). Credentials live in
# mosquitto/passwd (hashed) and the per-user topic rules in mosquitto/acl.
# Create/edit broker accounts with:
#   docker run --rm -v $PWD/mosquitto:/mosquitto/config eclipse-mosquitto:2.0 \
#     mosquitto_passwd -b /mosquitto/config/passwd <user> <password>

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Real-time feed + ingest publish inside QoS 0; allow plenty of inflight hashes
max_inflight_messages 0

persistence true
persistence_location /mosquitto/data/